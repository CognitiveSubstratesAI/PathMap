# ops.toml — the ONE operation table for the PathMapsSpec differential harness.
#
# `julia PathMap/tools/gen_spec_ops.jl` generates BOTH sides from this file:
#   lean/PathMapsSpec/SpecOps.lean                 (the model side, built by `lake build`)
#   test/differential/spec/ops_generated.jl        (the Julia side, run against PathMaps)
# so the two op tables cannot drift apart. Never edit the generated files by hand.
#
# Two zippers: `wz` writes map0 (rooted at r0), `rz` reads map1 (rooted at r1). They are separate
# maps, so every algebra op reads its source from rz while writing through wz.
#
# Wire format (our own; not upstream's):
#   header: n0 := u8%8 ; n0 × (len := u8%6 ; len × pathbyte ; val := u8)     -- map0
#           n1 := u8%8 ; n1 × (len := u8%6 ; len × pathbyte ; val := u8)     -- map1
#           r0 := u8%4 ; r0 × pathbyte ;  r1 := u8%4 ; r1 × pathbyte          -- roots (created if absent)
#   body:   repeated  op := u8 % nops ; [t := u8%2 if target = "rw"] ; operands
# Path bytes are masked to b%4 so generated tries share prefixes and branch.
#
# NAMES: `name` is the upstream Rust method name (`ZipperMoving::…`, `ZipperWriting::…`), or, for the
#   composite ops upstream's own Lean harness defines (`k_path_walk`, `make_map_val_count`, `dump`,
#   `take_map_restore`), that harness's op name — so a search for an upstream name finds its row here.
#   The `lean` expression calls the model function of the same name (camelCase); the `julia` expression
#   calls our port's function, and where that name differs from upstream's the pair is recorded in
#   workflows/PORT_NAME_MAP.tsv.
#
# target: "rw" — t = 0 runs on wz, t = 1 on rz;  "r" — rz only;  "w" — wz only.
#   A "rw" op with `wz_gap = "<reason>"` has no write-zipper method in our port: t = 0 emits
#   `skip:wz-gap` on both sides (the gap is listed, not papered over by harness code).
#
# Operand kinds: path (len u8%6, then bytes), byte (pathbyte), n8 (u8%8), i6 (u8%6), k4 (u8%4),
#   u8 (raw byte, a value), bool (u8%2 == 1), mask (n := u8%4 ; n × pathbyte -> sorted set)
# Each op binds its operands to a1, a2, ...; `z` is the target zipper and, for "w" ops, `r` is rz.
#   lean  : a Lean expression of type `String × Zip V` (rendered result, new target zipper)
#   julia : a Julia expression returning the rendered String; it mutates `z` in place. For "rw" ops
#           it must work on both zipper types — use the `sp_*` adapters (SpecHarness.jl), which
#           dispatch on ReadZipperCore / WriteZipperCore.
#   skip  : optional [{ lean = <Bool>, julia = <Bool>, token = "skip:<reason>" }] — evaluated
#           BEFORE the op on the unmodified state; both sides must decide identically.
#
# Rendering (identical on both sides): paths as lowercase hex or "_", values decimal or "-",
# bools "1"/"0", optional bytes as hex or "-", statuses Element/Identity/None, masks as hex bytes.
#
# Values: map values are UInt64 with OUR lattice (src/core/Ring.jl: pjoin = max, pmeet = min,
# psubtract = saturating, with identity masks) — the model's `ourOps` restates it. Upstream's u64
# lattice is a placeholder and deliberately differs (run_fuzz.jl header).
#
# Semantics: the model specifies the INTENDED behaviour of our port (lean/README.md). A divergence is either
# a defect in PathMaps (see docs/UPSTREAM_DELTA_2026-09-16.md) or a model error — attribute each one
# by replaying the state, never by the op name.

version = 3

# Write-side operations of the upstream model that are NOT in this table, and why:
gaps = [
  "prune_ascend: no wz_prune_ascend! in our port",
  "graft_src_at: no wz_graft_src_at! in our port",
  "get_val_mut_write: our get_val_mut returns a value, not a reference",
  "get_val_or_set_mut_with: no closure variant in our port",
  "join_into_take: mutates the source map, which rz reads",
  "graft_child_maps: upstream quarantines it (lean/FINDINGS.md #15)",
  "descend_until_observed: no PathObserver API in our port",
  "to_next_get_val: no public read-zipper method in our port",
  "get_val_agrees: no separate get_val/val pair in our port",
]

[[op]]
name = "descend_to"
target = "rw"
operands = ["path"]
lean = "(hexPath a1, z.descendTo a1)"
julia = "(sp_descend_to!(z, a1); hex_path(a1))"

[[op]]
name = "descend_to_byte"
target = "rw"
operands = ["byte"]
lean = "(hexByte a1, z.descendToByte a1)"
julia = "(sp_descend_to_byte!(z, a1); hex_byte(a1))"

[[op]]
name = "ascend"
target = "rw"
operands = ["n8"]
lean = "let (r, z) := z.ascend a1; (toString r, z)"
julia = "string(sp_ascend!(z, a1))"

[[op]]
name = "ascend_byte"
target = "rw"
operands = []
lean = "let (r, z) := z.ascendByte; (showBool r, z)"
julia = "show_bool(sp_ascend_byte!(z))"

[[op]]
name = "reset"
target = "rw"
operands = []
lean = "(\"-\", z.reset)"
julia = "(sp_reset!(z); \"-\")"

[[op]]
name = "descend_first_byte"
target = "rw"
operands = []
lean = "let (r, z) := z.descendFirstByte; (showByteOpt r, z)"
julia = "show_byte_opt(sp_moved_byte(z, sp_descend_first_byte!))"

[[op]]
name = "descend_last_byte"
target = "rw"
wz_gap = "no write-zipper method"
operands = []
lean = "let (r, z) := z.descendLastByte; (showByteOpt r, z)"
julia = "show_byte_opt(sp_moved_byte(z, zipper_descend_last_byte!))"

[[op]]
name = "descend_indexed_byte"
target = "rw"
operands = ["i6"]
lean = "let (r, z) := z.descendIndexedByte a1; (showByteOpt r, z)"
julia = "show_byte_opt(sp_moved_byte(z, zz -> sp_descend_indexed_byte!(zz, a1)))"

[[op]]
name = "descend_until"
target = "rw"
wz_gap = "no write-zipper method"
operands = []
lean = "let (r, z) := z.descendUntil; (showBool r, z)"
julia = "show_bool(zipper_descend_until!(z))"

[[op]]
name = "ascend_until"
target = "rw"
wz_gap = "no write-zipper method"
operands = []
lean = "let (r, z) := z.ascendUntil; (toString r, z)"
julia = "string(sp_ascended(z, zipper_ascend_until!))"

[[op]]
name = "ascend_until_branch"
target = "rw"
wz_gap = "no write-zipper method"
operands = []
lean = "let (r, z) := z.ascendUntilBranch; (toString r, z)"
julia = "string(sp_ascended(z, zipper_ascend_until_branch!))"

# Upstream's harness skips the two sibling moves at the zipper root because the Rust read zipper escapes
# its root there. Our port guards the root (Zipper.jl:914), so our spec COMPARES it: the model answers none.
[[op]]
name = "to_next_sibling_byte"
target = "rw"
operands = []
lean = "let (r, z) := z.toNextSiblingByte; (showByteOpt r, z)"
julia = "show_byte_opt(sp_moved_byte(z, sp_to_next_sibling_byte!))"

[[op]]
name = "to_prev_sibling_byte"
target = "rw"
operands = []
lean = "let (r, z) := z.toPrevSiblingByte; (showByteOpt r, z)"
julia = "show_byte_opt(sp_moved_byte(z, sp_to_prev_sibling_byte!))"

[[op]]
name = "to_next_step"
target = "rw"
wz_gap = "no write-zipper method"
operands = []
lean = "let (r, z) := z.toNextStep; (showBool r, z)"
julia = "show_bool(zipper_to_next_step!(z))"

[[op]]
name = "to_next_val"
target = "r"
operands = []
lean = "let (r, z) := z.toNextVal; (showBool r, z)"
julia = "show_bool(zipper_to_next_val!(z))"

# k = 0 is degenerate (upstream skips it too). The childless-focus skip (P0 #1, the trait-default
# k-path loop never returned) was removed when the read zipper got upstream's token walk.
[[op]]
name = "descend_first_k_path"
target = "r"
operands = ["k4"]
skip = [
  { lean = "a1 == 0", julia = "a1 == 0", token = "skip:k0" },
]
lean = "let (r, z) := z.descendFirstKPath a1; (showBool r, z)"
julia = "show_bool(zipper_descend_first_k_path!(z, a1))"

[[op]]
name = "k_path_walk"
target = "r"
operands = ["k4"]
skip = [
  { lean = "a1 == 0", julia = "a1 == 0", token = "skip:k0" },
]
lean = "let (ps, z) := kWalk z a1; (String.intercalate \",\" (ps.map hexPath), z)"
julia = "join(hex_path.(sp_k_walk!(z, a1)), \",\")"

[[op]]
name = "descend_last_path"
target = "r"
operands = []
lean = "let (r, z) := z.descendLastPath; (showBool r, z)"
julia = "show_bool(zipper_descend_last_path!(z))"

[[op]]
name = "move_to_path"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["path"]
lean = "let (r, z) := z.moveToPath a1; (toString r, z)"
julia = "string(zipper_move_to_path!(z, a1))"

[[op]]
name = "descend_to_existing"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["path"]
lean = "let (r, z) := z.descendToExisting a1; (toString r, z)"
julia = "string(zipper_descend_to_existing!(z, a1))"

[[op]]
name = "descend_to_val"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["path"]
lean = "let (r, z) := z.descendToVal a1; (toString r, z)"
julia = "string(zipper_descend_to_val!(z, a1))"

[[op]]
name = "descend_to_existing_byte"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["byte"]
lean = "let (r, z) := z.descendToExistingByte a1; (showBool r, z)"
julia = "show_bool(zipper_descend_to_existing_byte!(z, a1))"

[[op]]
name = "descend_until_max_bytes"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["n8"]
lean = "let (r, z) := z.descendUntilMaxBytes a1; (showBool r, z)"
julia = "show_bool(zipper_descend_until_max_bytes!(z, a1))"

[[op]]
name = "descend_to_check"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["path"]
lean = "let (r, z) := z.descendToCheck a1; (showBool r, z)"
julia = "show_bool(zipper_descend_to_check!(z, a1))"

[[op]]
name = "val_at"
target = "rw"
wz_gap = "no write-zipper method"
operands = ["path"]
lean = "(showVal (z.valAt a1), z)"
julia = "show_val(zipper_val_at(z, a1))"

# ── observations on either zipper ────────────────────────────────────────────────────────────────
# The subtrie at the focus as a map (TrieRef -> make_map) and as a fork (TrieRef -> fork_read_zipper).
[[op]]
name = "make_map_val_count"
target = "rw"
operands = []
lean = "(toString (z.makeMap.valCount []), z)"
julia = "string(val_count(tr_make_map(sp_focus_ref(st, z))))"

[[op]]
name = "dump"
target = "rw"
operands = []
lean = "(dumpAt z.trie z.focus, z)"
julia = "sp_dump_focus(st, z)"

# ── write zipper: values and paths ───────────────────────────────────────────────────────────────
[[op]]
name = "set_val"
target = "w"
operands = ["u8"]
lean = "let (o, z) := z.setVal (UInt64.ofNat a1.toNat); (showVal o, z)"
julia = "show_val(wz_set_val!(z, UInt64(a1)))"

# `prune` is always false: its effect depends on node layout (upstream lean/FINDINGS.md #7).
[[op]]
name = "remove_val"
target = "w"
operands = []
lean = "let (o, z) := z.removeVal false; (showVal o, z)"
julia = "show_val(wz_remove_val!(z, false))"

[[op]]
name = "create_path"
target = "w"
operands = []
lean = "let (b, z) := z.createPath; (showBool b, z)"
julia = "show_bool(wz_create_path!(z))"

# Explicit pruning is only layout-independent for a zipper rooted at the map root.
[[op]]
name = "prune_path"
target = "w"
operands = []
skip = [{ lean = "!z.root.isEmpty", julia = "!isempty(st.root0)", token = "skip:off-root-prune" }]
lean = "let (n, z) := z.prunePath; (toString n, z)"
julia = "string(wz_prune_path!(z))"

[[op]]
name = "get_val_or_set_mut"
target = "w"
operands = ["u8"]
lean = "let (v, z) := z.getValOrSetMut (UInt64.ofNat a1.toNat); (showVal (some v), z)"
julia = "show_val(wz_get_or_set_val!(z, UInt64(a1)))"

# ── write zipper: subtries ───────────────────────────────────────────────────────────────────────
# "?" when nothing was below the focus: the bool then depends on node materialisation (FINDINGS #8).
[[op]]
name = "remove_branches"
target = "w"
operands = []
lean = "let e := z.focusNodeIsEmpty; let (b, z) := z.removeBranches false; (if e then \"?\" else showBool b, z)"
julia = "(e = sp_child_count(z) == 0; b = wz_remove_branches!(z, false); e ? \"?\" : show_bool(b))"

[[op]]
name = "remove_unmasked_branches"
target = "w"
operands = ["mask"]
lean = "(hexPath a1, z.removeUnmaskedBranches a1 false)"
julia = "(wz_remove_unmasked_branches!(z, byte_mask(a1), false); hex_path(a1))"

[[op]]
name = "take_map_restore"
target = "w"
operands = []
lean = "let e := z.focusNodeIsEmpty && z.val.isNone; let (m, z) := z.takeMap false; match m with | some mm => (if e then \"?\" else \"1\", z.graftMap mm) | none => (if e then \"?\" else \"0\", z)"
julia = "(e = sp_child_count(z) == 0 && wz_get_val(z) === nothing; m = wz_take_map!(z, false); m === nothing || wz_graft_map!(z, m); e ? \"?\" : (m === nothing ? \"0\" : \"1\"))"

# `insert_prefix("")` is P1 #5 in docs/UPSTREAM_DELTA_2026-09-16.md (asserts in our port).
[[op]]
name = "insert_prefix"
target = "w"
operands = ["path"]
skip = [{ lean = "a1.isEmpty", julia = "isempty(a1)", token = "skip:empty-path" }]
lean = "let (b, z) := z.insertPrefix a1; (showBool b, z)"
julia = "show_bool(wz_insert_prefix!(z, a1))"

[[op]]
name = "remove_prefix"
target = "w"
operands = ["i6"]
lean = "let (b, z) := z.removePrefix a1; (showBool b, z)"
julia = "show_bool(wz_remove_prefix!(z, a1))"

# ── write zipper: grafting from rz ───────────────────────────────────────────────────────────────
# `graft` adopts the source's focus value (graft_root_vals, on by default upstream).
[[op]]
name = "graft"
target = "w"
operands = []
lean = "(\"-\", z.graft r)"
julia = "(wz_graft!(z, src_anr(st), src_val(st)); \"-\")"

[[op]]
name = "graft_map"
target = "w"
operands = []
lean = "(\"-\", z.graftMap r.makeMap)"
julia = "(wz_graft_map!(z, src_map(st)); \"-\")"

[[op]]
name = "graft_masked_branches"
target = "w"
operands = ["mask", "bool"]
lean = "(hexPath a1 ++ \":\" ++ showBool a2, z.graftMaskedBranches r a1 a2)"
julia = "(wz_graft_masked_branches!(z, src_anr(st), byte_mask(a1), a2); hex_path(a1) * \":\" * show_bool(a2))"

# ── write zipper: algebra with rz as the source ──────────────────────────────────────────────────
[[op]]
name = "join_into"
target = "w"
operands = []
lean = "let (st, z) := z.joinInto ourOps r; (toString st, z)"
julia = "show_status(wz_join_into!(z, src_anr(st)))"

[[op]]
name = "join_map_into"
target = "w"
operands = []
lean = "let e := z.focusNodeIsEmpty; let (st, z) := z.joinMapInto ourOps r.makeMap; (if e then \"?\" else toString st, z)"
julia = "(e = sp_child_count(z) == 0; s = wz_join_map_into!(z, src_map(st)); e ? \"?\" : show_status(s))"

[[op]]
name = "meet_into"
target = "w"
operands = []
lean = "let (st, z) := z.meetInto ourOps r false; (toString st, z)"
julia = "show_status(wz_meet_into!(z, src_anr(st), false, src_val(st)))"

[[op]]
name = "subtract_into"
target = "w"
operands = []
lean = "let (st, z) := z.subtractInto ourOps r false; (toString st, z)"
julia = "show_status(wz_subtract_into!(z, src_anr(st), false, src_val(st)))"

[[op]]
name = "restrict"
target = "w"
operands = []
lean = "let e := z.focusNodeIsEmpty; let (st, z) := z.restrict ourOps r; (if e then \"?\" else toString st, z)"
julia = "(e = sp_child_count(z) == 0; s = wz_restrict!(z, src_anr(st)); e ? \"?\" : show_status(s))"

# Skipped when either side has nothing below its focus (FINDINGS #8: the effect depends on whether
# an empty node was materialised).
[[op]]
name = "restricting"
target = "w"
operands = []
skip = [{ lean = "z.focusNodeIsEmpty || r.focusNodeIsEmpty", julia = "sp_child_count(z) == 0 || sp_child_count(st.rz) == 0", token = "skip:empty-focus" }]
lean = "let (b, z) := z.restricting r; (showBool b, z)"
julia = "show_bool(wz_restricting!(z, src_anr(st)))"

[[op]]
name = "meet_2"
target = "w"
operands = ["path"]
lean = "let (st, z) := z.meet2 ourOps r { r with path := r.path ++ a1 }; (toString st, z)"
julia = "show_status(wz_meet_2!(z, src_anr(st), src_anr(st, a1)))"

# `k = 0` is P1 #4 (should be the identity).
[[op]]
name = "join_k_path_into"
target = "w"
operands = ["k4"]
skip = [{ lean = "a1 == 0", julia = "a1 == 0", token = "skip:k0" }]
lean = "let (b, z) := z.joinKPathInto ourOps a1 false; (if z.focusNodeIsEmpty then \"?\" else showBool b, z)"
julia = "(b = wz_join_k_path_into!(z, a1, false); sp_child_count(z) == 0 ? \"?\" : show_bool(b))"

# Unspecified for k = 0 or a childless focus (the model's `meetKPathUnspecified`).
[[op]]
name = "meet_k_path_into"
target = "w"
operands = ["k4"]
skip = [
  { lean = "a1 == 0", julia = "a1 == 0", token = "skip:k0" },
  { lean = "z.focusNodeIsEmpty", julia = "sp_child_count(z) == 0", token = "skip:empty-focus" },
]
lean = "let (b, z) := z.meetKPathInto ourOps a1 false; (showBool b, z)"
julia = "show_bool(wz_meet_k_path_into!(z, a1, false))"
