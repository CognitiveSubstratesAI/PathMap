# Ground-truth generator for PathMap's upstream differential.
# Depends on the UPSTREAM Rust pathmap; its stdout is vendored as expected/upstream.tsv.
[package]
name = "pathmap_differential"
version = "0.1.0"
edition = "2021"

[dependencies]
# Relative so this is not machine-specific. Resolves to the upstream PathMap checkout
# alongside this workspace. If your layout differs, override without editing this file:
#     cargo run --release --bin gen_expected --config 'patch.crates-io.pathmap.path="/abs/path"'
# Builds against upstream pathmap 0.4.0 (f477a91) as of 2026-09-17 with NO source change: all four
# binaries compile, and gen_expected / gen_fuzz reproduce the vendored upstream.tsv / fuzz/expected.tsv
# byte for byte (the one 0.4.0 observable, `ascend` returning a count, is handled on the Julia side).
# NOTE: the GATE itself never needs this crate — upstream output is vendored at
# ../expected/upstream.tsv. Rust is only required to REGENERATE that file.
pathmap = { path = "../../../../../../dev-zone/PathMap" }

[[bin]]
name = "gen_expected"
path = "src/bin/gen_expected.rs"

[[bin]]
name = "gen_fuzz"
path = "src/bin/gen_fuzz.rs"

[workspace]

[[bin]]
name = "gen_keysets"
path = "src/bin/gen_keysets.rs"

[[bin]]
name = "gen_rootval"
path = "src/bin/gen_rootval.rs"
