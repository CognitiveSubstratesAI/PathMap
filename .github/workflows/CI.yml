name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 🔴 TESTS MUST RUN MULTI-THREADED, OR THE CONCURRENCY TESTS SKIP AND THE SUITE ERRORS.
    # `Pkg.test` spawns a test worker; without this the worker is SINGLE-THREADED, every
    # `Threads.nthreads() < 2` test `@test_skip`s, and `assert_no_inert_testsets` then FAILS the
    # run — correctly: "these ran and asserted NOTHING, so the green result overstates coverage by
    # exactly their scope". MEASURED 2026-09-28, the failure this fixes.
    # It reached CI only now because an undeclared `Random`/`Printf` aborted the run BEFORE the
    # guard; fixing the deps revealed a SECOND, pre-existing defect underneath.
    # WHY THE ENV VAR AND NOT A `julia_args`: Pkg passes it straight through. Julia 1.13.1
    # `Pkg/src/Operations.jl:2727` — "if set, prefer JULIA_NUM_THREADS because this is passed to
    # the test worker via --threads" — and the test path calls `run_test_subprocess(…;
    # with_threads = true)` (:3072). It must be NON-EMPTY or `get_threads_spec` throws.
    # 4 matches the local runner's default (`JULIA_TEST_THREADS:-4`), so CI and local contend alike.
    env:
      JULIA_NUM_THREADS: '4'
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'   # node-keyed @atomic COW refcount needs Julia 1.12+
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # Coverage → Codecov. `julia-runtest` already runs with `coverage: true` by default; these two
      # steps turn the per-file `.cov` output into `lcov.info` and upload it. `fail_ci_if_error: false`
      # keeps a Codecov outage (or a missing token on a fork) from failing an otherwise green build.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    name: Format (Blue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      # No julia-actions/cache here — a cached Manifest can pin an older
      # JuliaFormatter than the pinned version, causing local/CI drift.
      - name: Check formatting
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.14.0"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "All files Blue-formatted."
